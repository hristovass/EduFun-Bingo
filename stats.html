<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Quiz Bingo — Statistika</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="web-api.js"></script>
  <link rel="stylesheet" href="bingo-theme.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 15% 5%,
          rgba(98, 112, 220, 0.16),
          transparent 32rem
        ),
        radial-gradient(
          circle at 90% 85%,
          rgba(98, 112, 220, 0.08),
          transparent 30rem
        ),
        #080b14 !important;

      color: #f4f6ff !important;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;

      padding: 40px 20px;
    }

    .stats-shell {
      width: min(900px, 100%);
      margin: 0 auto;

      background: rgba(16, 21, 38, 0.94);
      border: 1px solid rgba(143, 156, 255, 0.16);
      border-radius: 28px;

      padding: 32px;

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.4);

      backdrop-filter: blur(20px);
    }

    .stats-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .stats-label {
      display: inline-block;

      padding: 6px 12px;
      margin-bottom: 12px;

      border-radius: 999px;
      border: 1px solid rgba(143, 156, 255, 0.25);

      color: #aeb7ff;
      background: rgba(143, 156, 255, 0.08);

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .stats-title {
      margin: 0;
      color: #f4f6ff;
      font-size: 30px;
      font-weight: 750;
    }

    .stats-subtitle {
      margin-top: 8px;
      color: #9ca5bd;
      font-size: 14px;
    }

    .card {
      background: rgba(21, 27, 45, 0.96) !important;
      border: 1px solid rgba(143, 156, 255, 0.16) !important;
      border-radius: 20px;

      padding: 18px;
      margin-bottom: 20px;

      color: #f4f6ff !important;

      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.22);
    }

    .card h2 {
      color: #f4f6ff !important;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .table-wrapper {
      overflow-x: auto;
      padding: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;

      background: transparent !important;
      color: #f4f6ff !important;
    }

    thead {
      background: #202742 !important;
    }

    th {
      padding: 14px 16px;

      color: #f4f6ff !important;
      font-size: 13px;
      font-weight: 700;

      border-bottom: 1px solid rgba(143, 156, 255, 0.20);
    }

    td {
      padding: 13px 16px;
      color: #d9def2 !important;

      border-bottom:
        1px solid rgba(143, 156, 255, 0.08);
    }

    tbody tr {
      background: #151b2d !important;
    }

    tbody tr:hover {
      background: #1b2238 !important;
    }

    #stats-chart {
      background: transparent !important;
      max-height: 330px;
    }

    #heatmap {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    .heatmap-card {
      padding: 16px;

      border-radius: 15px;
      border: 1px solid rgba(143, 156, 255, 0.22);

      background:
        linear-gradient(
          135deg,
          rgba(143, 156, 255, 0.16),
          rgba(77, 89, 170, 0.10)
        ) !important;

      color: #ffffff !important;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.18);
    }

    .heatmap-card strong,
    .heatmap-card span {
      color: #ffffff !important;
    }

    .heatmap-percent {
      color: #aeb7ff !important;
      font-weight: 800;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      margin-top: 24px;

      flex-wrap: wrap;
    }

    #reset-btn {
      padding: 10px 17px;

      border-radius: 999px;
      border:
        1px solid rgba(255, 125, 143, 0.55);

      background:
        rgba(255, 125, 143, 0.05);

      color: #ff9aaa !important;

      font-size: 14px;
      font-weight: 650;

      cursor: pointer;

      transition: 0.2s ease;
    }

    #reset-btn:hover {
      background:
        rgba(255, 125, 143, 0.13);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 11px 18px;

      border-radius: 999px;

      border:
        1px solid rgba(143, 156, 255, 0.35);

      background:
        rgba(143, 156, 255, 0.12);

      color: #f4f6ff !important;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      transition: 0.2s ease;
    }

    .back-btn:hover {
      background:
        rgba(143, 156, 255, 0.22);

      border-color:
        rgba(143, 156, 255, 0.70);
    }

    #no-data {
      padding: 30px;
      text-align: center;

      color: #9ca5bd !important;

      background: #151b2d;

      border:
        1px solid rgba(143, 156, 255, 0.16);

      border-radius: 18px;
    }

    @media (max-width: 640px) {
      body {
        padding: 20px 12px;
      }

      .stats-shell {
        padding: 20px 14px;
      }

      .stats-title {
        font-size: 24px;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .back-btn,
      #reset-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body class="dark">

  <main class="stats-shell">

    <header class="stats-header">
      <div class="stats-label">
        QUIZ BINGO · ANALITIKA
      </div>

      <h1 class="stats-title">
        📊 Statistika po predmetih
      </h1>

      <p class="stats-subtitle">
        Pregled uspešnosti pri dosedanjih igrah.
      </p>
    </header>

    <p id="no-data" class="hidden">
      Še ni zabeleženih rezultatov.
      Najprej odigraj kakšno igro 😊
    </p>

    <section
      id="stats-section"
      class="hidden"
    >

      <!-- TABELA -->
      <div class="card table-wrapper">
        <table>
          <thead>
            <tr>
              <th style="text-align:left;">
                Predmet / kategorija
              </th>

              <th style="text-align:right;">
                Pravilni
              </th>

              <th style="text-align:right;">
                Vsi odgovori
              </th>

              <th style="text-align:right;">
                Uspešnost
              </th>
            </tr>
          </thead>

          <tbody id="stats-table-body"></tbody>
        </table>
      </div>

      <!-- GRAF -->
      <div class="card">
        <h2>
          Pravilni odgovori po predmetih
        </h2>

        <canvas
          id="stats-chart"
          height="120"
        ></canvas>
      </div>

      <!-- HITRI PREGLED -->
      <div class="card">
        <h2>
          Hitri pregled
        </h2>

        <div id="heatmap"></div>
      </div>

      <div class="actions">
        <button
          id="reset-btn"
          type="button"
        >
          ♻ Resetiraj statistiko
        </button>
      </div>

    </section>

    <div
      id="no-data-back"
      class="actions hidden"
    >
      <a
        href="index.html"
        class="back-btn"
      >
        ← Nazaj na Bingo
      </a>
    </div>

  </main>

  <script>
    const STATS_KEY = 'quizBingoStats';

    async function getStats() {
      return window.api.getStats();
    }

    async function clearStats() {
      await window.api.clearStats();
      localStorage.removeItem(STATS_KEY);
    }

    document.addEventListener(
      'DOMContentLoaded',
      async () => {

        /* Vedno uporabljamo temno temo */
        localStorage.setItem('theme', 'dark');
        document.body.classList.add('dark');

        /* ID kategorije -> ime */
        const categoriesById = {};

        if (window.api?.loadMenu) {
          try {
            const menu =
              await window.api.loadMenu();

            (menu.categories || [])
              .forEach(cat => {
                categoriesById[
                  String(cat.id)
                ] = cat.name;
              });

          } catch (e) {
            console.error(
              'Napaka pri loadMenu v stats.html:',
              e
            );
          }
        }

        function displayName(key) {
          return (
            categoriesById[String(key)] ||
            key
          );
        }

        const stats = await getStats();
        const subjects =
          Object.keys(stats || {});

        const noDataEl =
          document.getElementById('no-data');

        const statsSection =
          document.getElementById(
            'stats-section'
          );

        const noDataBack =
          document.getElementById(
            'no-data-back'
          );

        if (subjects.length === 0) {
          noDataEl.classList.remove('hidden');
          noDataBack.classList.remove('hidden');
          return;
        }

        statsSection.classList.remove('hidden');

        /* ---------- TABELA ---------- */

        const tbody =
          document.getElementById(
            'stats-table-body'
          );

        subjects.forEach(subKey => {

          const {
            correct,
            total
          } = stats[subKey];

          const rate =
            total
              ? Math.round(
                  (correct / total) * 100
                )
              : 0;

          const name =
            displayName(subKey);

          const tr =
            document.createElement('tr');

          tr.innerHTML = `
            <td style="font-weight:600;">
              ${name}
            </td>

            <td style="text-align:right;">
              ${correct}
            </td>

            <td style="text-align:right;">
              ${total}
            </td>

            <td style="text-align:right; color:#aeb7ff !important; font-weight:700;">
              ${rate}%
            </td>
          `;

          tbody.appendChild(tr);
        });

        /* ---------- GRAF ---------- */

        const labels =
          subjects.map(
            key => displayName(key)
          );

        const correctCounts =
          subjects.map(key => {
            return (
              stats[key]?.correct || 0
            );
          });

        const ctx =
          document
            .getElementById('stats-chart')
            .getContext('2d');

        const gradient =
          ctx.createLinearGradient(
            0,
            0,
            0,
            260
          );

        gradient.addColorStop(
          0,
          '#aeb7ff'
        );

        gradient.addColorStop(
          1,
          '#6f7ee8'
        );

        new Chart(ctx, {
          type: 'bar',

          data: {
            labels,

            datasets: [{
              label:
                'Pravilni odgovori',

              data:
                correctCounts,

              backgroundColor:
                gradient,

              borderColor:
                '#c7ceff',

              borderWidth: 1,

              borderRadius: 10,

              borderSkipped:
                false,

              barThickness: 40
            }]
          },

          options: {
            responsive: true,

            maintainAspectRatio:
              true,

            plugins: {

              legend: {
                display: false
              },

              tooltip: {
                backgroundColor:
                  'rgba(8,11,20,0.97)',

                titleColor:
                  '#f4f6ff',

                bodyColor:
                  '#d9def2',

                padding: 12,

                borderWidth: 1,

                borderColor:
                  'rgba(143,156,255,0.35)',

                callbacks: {

                  label: context => {

                    const index =
                      context.dataIndex;

                    const key =
                      subjects[index];

                    const name =
                      displayName(key);

                    const correct =
                      stats[key]?.correct || 0;

                    const total =
                      stats[key]?.total || 0;

                    const percent =
                      total
                        ? Math.round(
                            (correct / total) *
                            100
                          )
                        : 0;

                    return (
                      ` ${name}: ` +
                      `${correct}/${total} ` +
                      `(${percent}%)`
                    );
                  }
                }
              }
            },

            scales: {

              x: {
                border: {
                  color:
                    'rgba(143,156,255,0.15)'
                },

                grid: {
                  display: false
                },

                ticks: {
                  color: '#cbd5f5',

                  font: {
                    size: 12,
                    weight: '600'
                  }
                }
              },

              y: {
                beginAtZero: true,

                border: {
                  color:
                    'rgba(143,156,255,0.15)'
                },

                grid: {
                  color:
                    'rgba(143,156,255,0.10)'
                },

                ticks: {
                  color: '#9ca5bd',
                  precision: 0
                }
              }
            }
          }
        });

        /* ---------- HITRI PREGLED ---------- */

        const heatmap =
          document.getElementById(
            'heatmap'
          );

        subjects.forEach(subKey => {

          const {
            correct,
            total
          } = stats[subKey];

          const rate =
            total
              ? Math.round(
                  (correct / total) * 100
                )
              : 0;

          const name =
            displayName(subKey);

          const card =
            document.createElement('div');

          card.className =
            'heatmap-card';

          card.innerHTML = `
            <div style="
              display:flex;
              justify-content:space-between;
              align-items:center;
              gap:10px;
            ">
              <strong>
                ${name}
              </strong>

              <span class="heatmap-percent">
                ${rate}%
              </span>
            </div>

            <div style="
              margin-top:7px;
              color:#9ca5bd;
              font-size:12px;
            ">
              ${correct}/${total} pravilnih
            </div>
          `;

          heatmap.appendChild(card);
        });

        /* ---------- RESET ---------- */

        document
          .getElementById('reset-btn')
          .addEventListener(
            'click',
            async () => {

              if (
                confirm(
                  'Res želiš izbrisati vso statistiko?'
                )
              ) {
                await clearStats();
                location.reload();
              }
            }
          );
      }
    );
  </script>

</body>
</html>
